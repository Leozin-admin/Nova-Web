<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexgear - Login</title>
    <link rel="stylesheet" href="login.css">
    <script src="login.js" defer></script>
</head>

<body>
    <main class="login-container">
        <h1>Login</h1>
        <form id="form-login" action="#" method="post" onsubmit="return entrar()">
            <input type="hidden" name="origem" value="tela-login">
            <div class="campo">
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" placeholder="Seuemail@gmail.com" required>
                <span class="erro" id="erro-email"></span>
            </div>

            <div class="campo">
                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" placeholder="Digite sua senha:" minlength="8" required>
            </div>

            <button type="submit">Entrar</button>
            <p id="mensagem-form" role="status" aria-live="polite"></p>
        </form>

        <div class="links">
            <p>Não lembra da sua senha?</p><a href="#">Clique Aqui</a>
            <p>Ainda não tem uma conta?</p><a href="cadastro.html">Crie uma aqui</a>
        </div>
    </main>

</body>


</html>
