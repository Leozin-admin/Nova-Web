<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nexgear - Cadastro</title>

    <link rel="stylesheet" href="cadastro.css">
    <script src="cadastro.js" defer></script>
</head>

<body>
    <main class="cadastro-container">
        <h1>Criar conta</h1>

        <form onsubmit="return cadastrar()">
            <div class="campo">
                <label for="nome">Nome completo:</label>
                <input type="text" id="nome" name="nome" required>
            </div>

            <div class="campo">
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="campo">
                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" minlength="8" required>
            </div>

            <div class="campo">
                <label for="cpf">CPF:</label>
                <input type="text" id="cpf" name="cpf" inputmode="numeric" maxlength="11" pattern="[0-9]{11}"
                    placeholder="Somente os 11 números" required>
            </div>

            <div class="campo">
                <label for="nascimento">Data de nascimento:</label>
                <input type="date" id="nascimento" name="nascimento" required>
            </div>

            <div class="campo">
                <label for="cidade">Cidade onde mora:</label>
                <input type="text" id="cidade" name="cidade" required>
            </div>

            <div class="campo">
                <label for="cep">CEP:</label>
                <input type="text" id="cep" name="cep" inputmode="numeric" maxlength="8" pattern="[0-9]{8}"
                    placeholder="Somente os 8 números" required>
            </div>

            <button type="submit">Criar conta</button>

            <p id="mensagem"></p>
        </form>

        <p>Já tem uma conta? <a href="login.html">Entrar</a></p>
    </main>
</body>

</html>
