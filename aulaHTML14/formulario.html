<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 14 - Com varios Inputs</title>
    <link rel="stylesheet" href="formulario.css">
    <script src="formulario.js" defer></script>
</head>

<body>
    <main class="caixa-form">
        <h1>Cadastro:</h1>
        <p class="instrucao">Clique para Habilitar a Edição de Campos</p>

        <form id="formulario" action="#" method="post" novalidate>
            <div class="campo">
                <label for="nome">Nome</label>
                <div class="linha">
                    <input type="text" id="nome" name="nome" placeholder="Seu Nome Completo" required minlength="3"
                        disabled>
                    <button type="button">Habilitar</button>
                </div>
            </div>

            <div class="campo">
                <label for="email">E-mail</label>
                <div class="linha">
                    <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required disabled>
                    <button type="button">Habilitar</button>
                </div>
            </div>

            <div class="campo">
                <label for="telefone">Telefone</label>
                <div class="linha">
                    <input type="tel" id="telefone" name="telefone" placeholder="(11) 99999-9999"
                        pattern="\(\d{2}\) \d{4,5}-\d{4}" required disabled>
                    <button type="button">Habilitar</button>
                </div>
            </div>

            <div class="campo">
                <label for="senha">Idade</label>
                <div class="linha">
                    <input type="number" id="Idade" name="Idade" placeholder="Digite sua idade:" min="1" max="100"
                        required disabled>
                    <button type="button">Habilitar</button>
                </div>
            </div>
        </form>

</body>

</html>
